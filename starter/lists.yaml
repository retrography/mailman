# Lists of senders and platforms. Yours fill up as you use mailman (block, safelist, kids, health …).
safelist:
  description: senders always rescued into the inbox (wildcard patterns)
  holds: patterns
  entries: []
blocked:
  description: 'blocked senders: their mail is labelled Blocked and deleted (to Trash). Kept in sync with the label Blocked;
    unblocking brings the mail back'
  holds: senders
  source:
    gmail_label: Blocked
  normalise:
    collapse_to_domain_at: 2
    never_collapse:
      lists:
      - safelist
      - platforms
      addresses:
      - '{{identity | emails}}'
  on_new_entry: retro_block
  entries: []
periodicals:
  description: 'newsletters you read: label Periodicals, always out of the inbox'
  holds: senders
  entries: []
