# Home Assistant app manifest. The image is built by .github/workflows/image.yml from this repository.
name: Mailman
version: "0.11.0"
slug: mailman
url: https://github.com/retrography/mailman
image: ghcr.io/retrography/mailman
description: Sorts your Gmail (and an Outlook mailbox) by rules you can read and change - labels, files, and deletes what you never wanted
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:email-fast-outline
panel_title: Mailman
homeassistant_api: true          # the alerts are shown in Home Assistant too
watchdog: tcp://[HOST]:[PORT:8099]
backup: hot
map:
  - type: homeassistant_config   # /homeassistant in the container: mailman/config and mailman/data live there
    read_only: false
  - type: addon_config           # /config in the container: where versions before 0.11.0 kept everything
    read_only: false
options:
  typesafe_api_key: ""
schema:
  typesafe_api_key: password
  gmail_client_id: password?
  gmail_client_secret: password?
  gmail_refresh_token: password?
  outlook_client_id: str?
  outlook_tenant: str?
