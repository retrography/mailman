[project]
name = "mailman"
version = "0.4.0"
description = "Gmail triage with readable rules, a web interface, and a Home Assistant app"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typesafe-sdk",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "beautifulsoup4",
    "pyyaml",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.40",
    "pycountry>=26.2.16",
    "imapclient>=4.1.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mailman = "mailman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailman"]
