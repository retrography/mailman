name: image
# Builds the app image for amd64 and aarch64 and publishes it as ghcr.io/<owner>/mailman:<version>, the
# version being the one in mailman/config.yaml. Home Assistant downloads that image.
on:
  push:
    branches: [main]
    paths: [src/**, starter/**, Dockerfile, pyproject.toml, uv.lock, mailman/config.yaml, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(grep -E '^version:' mailman/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailman:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mailman:latest
